services:
  keycloak:
    build:
      context: ../..
      dockerfile: examples/docker-compose/Dockerfile
    command:
      - start
      - --optimized
      - --http-enabled=true
      - --hostname-strict=false
    ports:
      - "127.0.0.1:${KEYCLOAK_HTTP_PORT:-8080}:8080"
    volumes:
      - "./secrets/tencent-captcha.env:/run/secrets/tencent-captcha.env:ro"
      - keycloak-data:/opt/keycloak/data

volumes:
  keycloak-data:
