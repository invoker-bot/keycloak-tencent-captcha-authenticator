name: Feature request
description: Propose a public, portable enhancement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        The project stays independent of specific applications, private infrastructure, secret stores, and third-party themes. Use private vulnerability reporting for security disclosures.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the operator or user problem without prescribing an implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the portable behavior and how it interacts with the documented 0.1.x contract.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security, privacy, and compatibility impact
      description: Address fail-closed behavior, data sent to Tencent, proxy IP, CSP, secrets, flow scope, and Keycloak compatibility as relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
